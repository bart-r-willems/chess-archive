<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess Archive Viewer</title>
<link rel="stylesheet" href="viewer.css?v=0.6.8">
</head>
<body>

<!-- ═══ SHARED HEADER ═══ -->
<header>
  <h1>♟ Chess Archive</h1>

  <!-- GAMES view nav -->
  <nav id="navGames" class="view-nav">
    <span class="view-label">Games</span>
  </nav>

  <!-- BOARD view nav -->
  <nav id="navBoard" class="view-nav" style="display:none">
    <button class="btn nav-back" id="btnBack">← Games</button>
    <span class="view-label" id="boardTitle"></span>
  </nav>

  <span id="buildBadge"></span>
  <button id="btnSettings" class="btn-settings" title="Customise">⚙</button>
</header>

<!-- ═══ GAMES VIEW ═══ -->
<div id="viewGames" class="view">

  <div id="loadMsg" class="load-msg">Fetching game file…</div>

  <div class="game-list-wrap" id="gameListWrap" style="display:none">
    <table class="game-table" id="gameTable">
      <thead>
        <!-- Toolbar row — columns aligned with table -->
        <tr class="gt-toolbar-row">
          <td class="gt-col-num"></td>
          <td class="gt-col-name" colspan="2">
            <div class="gt-toolbar-cell">
              <label class="gt-toolbar-label">Collection</label>
              <select id="pgnSelect" class="gt-toolbar-select"><option>Loading…</option></select>
              <label class="gt-toolbar-label" style="margin-top:4px">Player</label>
              <div class="player-filter-wrap">
                <input type="text" id="playerFilter" class="player-filter-input" placeholder="Search player…" autocomplete="off">
                <button id="playerFilterClear" class="player-filter-clear" title="Clear" style="display:none">✕</button>
              </div>
            </div>
          </td>
          <td class="gt-col-date">
            <div class="gt-toolbar-cell">
              <label class="gt-toolbar-label">Year</label>
              <select id="yearFilter" class="gt-toolbar-select gt-toolbar-filter">
                <option value="">— all —</option>
              </select>
            </div>
          </td>
          <td class="gt-col-event">
            <div class="gt-toolbar-cell">
              <label class="gt-toolbar-label">Event</label>
              <select id="eventFilter" class="gt-toolbar-select gt-toolbar-filter">
                <option value="">— all events —</option>
              </select>
            </div>
          </td>
          <td class="gt-col-eco">
            <div class="gt-toolbar-cell">
              <label class="gt-toolbar-label">ECO</label>
              <select id="ecoFilter" class="gt-toolbar-select gt-toolbar-filter">
                <option value="">— all —</option>
              </select>
            </div>
          </td>
          <td class="gt-col-moves"></td>
          <td class="gt-col-res">
            <div class="gt-toolbar-cell" style="text-align:right">
              <span id="gamesStats" class="games-stats"></span>
            </div>
          </td>
        </tr>
        <!-- Column headers row -->
        <tr>
          <th class="gt-col-num"  data-col="num"   >#</th>
          <th class="gt-col-name" data-col="white" ><span class="gt-th-label">White</span><button class="gt-funnel" data-filter-col="white"  title="Filter White">⊿</button></th>
          <th class="gt-col-name" data-col="black" ><span class="gt-th-label">Black</span><button class="gt-funnel" data-filter-col="black"  title="Filter Black">⊿</button></th>
          <th class="gt-col-date" data-col="date"  ><span class="gt-th-label">Date</span><button class="gt-funnel" data-filter-col="date"   title="Filter Date">⊿</button></th>
          <th class="gt-col-event"data-col="event" ><span class="gt-th-label">Event</span><button class="gt-funnel" data-filter-col="event"  title="Filter Event">⊿</button></th>
          <th class="gt-col-eco"  data-col="eco"   ><span class="gt-th-label">ECO</span><button class="gt-funnel" data-filter-col="eco"    title="Filter ECO">⊿</button></th>
          <th class="gt-col-moves" data-col="moves" title="Sort by game length">Moves</th>
          <th class="gt-col-res"  data-col="result"><span class="gt-th-label">Res</span><button class="gt-funnel" data-filter-col="result" title="Filter Result">⊿</button></th>
        </tr>
      </thead>
      <tbody id="gameTableBody"></tbody>
    </table>
  </div>

  <div id="filterStatus" class="filter-status" style="display:none"></div>

  <!-- Filter popover -->
  <div id="filterPopover" class="filter-popover" style="display:none">
    <div id="filterPopoverInner"></div>
  </div>

</div>

<!-- ═══ BOARD VIEW ═══ -->
<div id="viewBoard" class="view" style="display:none">
  <div class="board-layout">

    <!-- Left: game info -->
    <div class="info-col">
      <div class="info-box">
        <h2>Game Info</h2>
        <div id="infoRows"><div class="info-row"><span class="info-label">—</span></div></div>
      </div>
    </div>

    <!-- Eval bar -->
    <div class="eval-col">
      <div class="eval-bar-wrap" id="evalBarWrap">
        <div class="eval-bar-black" id="evalBarBlack"></div>
        <div class="eval-bar-white" id="evalBarWhite"></div>
      </div>
      <div class="eval-score" id="evalScore">—</div>
    </div>

    <!-- Board column -->
    <div class="board-col">
      <div class="board-with-coords" style="position:relative">
        <div class="coord-ranks" id="rankCoords"></div>
        <div style="position:relative">
          <div id="board"></div>
          <svg id="arrowLayer" style="position:absolute;top:0;left:0;width:512px;height:512px;pointer-events:none;" viewBox="0 0 512 512"></svg>
        </div>
        <div class="coord-files" id="fileCoords"></div>
        <div id="resultPopup"><div class="popup-inner" id="popupInner"></div></div>
      </div>

      <div class="controls" id="controls">
        <button class="btn" id="btnStart" title="Go to start">⏮</button>
        <button class="btn" id="btnPrev"  title="Previous move">◀</button>
        <button class="btn" id="btnNext"  title="Next move">▶</button>
        <button class="btn" id="btnEnd"   title="Go to end">⏭</button>
        <span class="move-counter" id="moveCtr"></span>
        <button class="btn btn-analyse" id="btnAnalyse" title="Toggle Stockfish analysis">⚡ Analyse</button>
      </div>

      <div class="status" id="status"></div>
      <div class="pv-line" id="pvLine"></div>
      <div class="kb-hint">← → arrow keys · Home / End to jump</div>
    </div>

    <!-- Right: move list -->
    <div class="right-col">
      <div class="move-list-box">
        <h2>Moves</h2>
        <div id="moveList"></div>
      </div>
    </div>

  </div>
</div>

<!-- ═══ SETTINGS MODAL ═══ -->
<div id="settingsModal" class="smodal-backdrop">
  <div class="smodal">
    <div class="smodal-header">
      <h2>⚙ Settings</h2>
      <button id="modalClose" class="smodal-close">✕</button>
    </div>
    <div id="settingsBody" class="smodal-body"></div>
  </div>
</div>

<script src="chess.js?v=0.6.8"></script>
</body>
</html>
